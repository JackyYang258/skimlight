<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skimlight 设置</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --bg: #fbfaf7; --card: #ffffff;
          --accent: #2f5bd3; --ok: #1a7f37; --err: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececef; --muted: #9a9aa2; --line: #34343a; --bg: #17171a; --card: #1f1f23;
            --accent: #8aa8ff; --ok: #4ac26b; --err: #ff7a6e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, "PingFang SC", sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .radios { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .radios label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
  .keyrow { display: flex; gap: 8px; }
  input[type=password], input[type=text], input[type=number] {
    flex: 1; min-width: 0; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
  input[type=number] { font-family: inherit; max-width: 140px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border-radius: 7px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #msg { min-height: 1.6em; margin-top: 12px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  .status { display: flex; gap: 8px; align-items: baseline; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; transform: translateY(-1px); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  a { color: var(--accent); }
  code { font: 12px ui-monospace, Consolas, monospace; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Skimlight 设置</h1>
  <p class="sub">API key 由本机的 Skimlight 本地程序保存在配置文件中，不存入浏览器，也不会同步到其他设备。</p>

  <section class="card">
    <h2>本地程序</h2>
    <div class="status"><span class="dot" id="hostDot"></span><span id="hostStatus">正在连接…</span></div>
    <div class="hint" id="hostHint"></div>
  </section>

  <section class="card" id="form">
    <h2>Jev 服务</h2>
    <div class="field">
      <label>服务商</label>
      <div class="radios" id="providers"></div>
      <div class="hint" id="providerHint"></div>
    </div>
    <div class="field">
      <label for="key">API key</label>
      <div class="keyrow">
        <input type="password" id="key" autocomplete="off" spellcheck="false">
        <button type="button" class="secondary" id="reveal">显示</button>
      </div>
      <div class="hint" id="keyHint"></div>
    </div>
    <div class="field">
      <label for="budget">每日费用上限（美元）</label>
      <input type="number" id="budget" min="0.01" max="100" step="0.1">
      <div class="hint">当天费用达到上限后暂停处理新的段落，已缓存的段落仍可显示。一篇 2000 词的英文文章约 $0.001。</div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="save">保存</button>
      <button type="button" class="secondary" id="test">测试连接</button>
    </div>
    <div id="msg" role="status"></div>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
